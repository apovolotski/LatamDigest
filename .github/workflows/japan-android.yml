name: Japanese Android build and test
on:
  push:
    branches: [codex/android-japan]
    paths: ["android-japan/**", ".github/workflows/japan-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: japan-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android-japan/**/*.gradle.kts
      - name: Build and verify
        working-directory: android-japan
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :app:bundleRelease :app:assembleRelease --console=plain -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8"
      - name: Enable test virtualization
        run: sudo chmod a+rw /dev/kvm
      - name: Android 16 device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android-japan
          script: |
            ./gradlew :app:connectedDebugAndroidTest --console=plain -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8"
            adb pull /sdcard/Pictures/JapanDigest app/build/outputs/screenshots
      - name: Retain test evidence and unsigned build products
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JapanDigest-Android
          retention-days: 14
          path: |
            android-japan/app/build/outputs/
            android-japan/app/build/reports/
            android-japan/app/build/test-results/
