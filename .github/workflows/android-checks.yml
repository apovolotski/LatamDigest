name: Android Checks
on:
  push:
    paths: ['android/**', '.github/workflows/android-checks.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test, lint and build Android
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/
          retention-days: 14
