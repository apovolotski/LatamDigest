plugins { id 'com.android.application' }
android {
    namespace 'com.apovolotski.latamdigest'
    compileSdk 36
    defaultConfig { applicationId 'com.apovolotski.latamdigest'; minSdk 26; targetSdk 36; versionCode 1; versionName '1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('LATAM_UPLOAD_KEYSTORE')) {
                storeFile file(System.getenv('LATAM_UPLOAD_KEYSTORE'))
                storePassword System.getenv('LATAM_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('LATAM_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('LATAM_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303'; androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test:core:1.6.1'; androidTestImplementation 'junit:junit:4.13.2' }
